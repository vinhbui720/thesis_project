controller_manager:
  ros__parameters:
    update_rate: 100  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

joint_trajectory_controller:
  ros__parameters:
    joints:
      - joint_1_s
      - joint_2_l
      - joint_3_u
      - joint_4_r
      - joint_5_b
      - joint_6_t

    command_interfaces:
      - position

    state_interfaces:
      - position
      - velocity

    # ----------------------------------------------------------------
    # 🔥 CRITICAL FIX: PID Gains prevent the robot from collapsing 🔥
    # "p" = Stiffness (Holds the arm up)
    # "d" = Damping (Prevents wobbling)
    # ----------------------------------------------------------------
    gains:
      joint_1_s: {p: 500.0, i: 0.0, d: 10.0}
      joint_2_l: {p: 1000.0, i: 0.0, d: 20.0} # Higher gain for lifting the arm
      joint_3_u: {p: 800.0, i: 0.0, d: 15.0}
      joint_4_r: {p: 500.0, i: 0.0, d: 5.0}
      joint_5_b: {p: 200.0, i: 0.0, d: 2.0}
      joint_6_t: {p: 100.0, i: 0.0, d: 1.0}

    # Optional but recommended for smooth trajectory execution
    state_publish_rate: 50.0
    action_monitor_rate: 20.0