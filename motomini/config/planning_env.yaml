environment:

  home_pose:
    xyz: [0.30, 0.0, 0.40] # Replace with your robot's actual home X, Y, Z
    rpy: [0.0, 3.14159, 0.0] # Replace with your robot's actual home Roll, Pitch, Yaw
  
  world_frame: world

  frames:

    # -------------------------------------------------
    # Example 1: OVERRIDE an existing URDF frame
    # -------------------------------------------------
    world_depth_camera_link:

      parent: workcell
      type: override_urdf

      pose:
        xyz: [0.225, -0.225, 0.245]
        rpy: [0.0, 3.14159, 3.14159]

      sensor:
        type: realsense_d435

        pointcloud:
          voxel_size: 0.003
          max_range: 1.2
          min_range: 0.1


    # -------------------------------------------------
    # Example 2: ADD new frame to TF tree
    # -------------------------------------------------
    working_tip:

      parent: world
      type: new_frame

      pose:
        xyz: [0.40, 0.15, 0.05]
        rpy: [0.0, 0.0, 1.57]

      grasp:
        approach_distance: 0.10
        lift_height: 0.15
        gripper_width: 0.03


