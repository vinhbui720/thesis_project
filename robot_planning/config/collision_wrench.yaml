###############################################################################
# online_collision_debugger  —  Collision Wrench Publisher Configuration
# File : config/collision_wrench.yaml
###############################################################################
#
# ══════════════════════════════════════════════════════════════════════════════
#  LÝ THUYẾT MÔ HÌNH LỰC PHẢN HỒI VẬT CẢN
# ══════════════════════════════════════════════════════════════════════════════
#
#  Node này sử dụng Tesseract để kiểm tra va chạm liên tục dựa trên /joint_states,
#  sau đó tổng hợp một lực ảo (virtual repulsive wrench) gửi cho bộ điều khiển
#  trở kháng.  Lực tổng bao gồm hai thành phần độc lập:
#
#    F_total = F_normal + F_tangential
#
# ──────────────────────────────────────────────────────────────────────────────
#  1.  THÀNH PHẦN PHÁP TUYẾN  (đẩy robot ra xa vật cản)
# ──────────────────────────────────────────────────────────────────────────────
#
#  Ký hiệu:
#    d      = khoảng cách va chạm gần nhất (m)
#    d0     = collision_influence_distance   (bắt đầu kích hoạt lực)
#    d_s    = collision_safe_distance        (ngưỡng an toàn)
#    d_stop = collision_stop_distance        (ngưỡng cứng / penetration)
#    n̂      = hướng đẩy ra (unit push-away normal)
#
#  Bước 1 — Chuẩn hóa khoảng cách thành t ∈ [0,1]:
#
#    t = clamp((d0 - d) / (d0 - d_s), 0, 1)
#
#  Bước 2 — Smoothstep (tránh giật ở biên):
#
#    s(t) = t² (3 - 2t)          ← smoothstep cổ điển
#
#  Bước 3 — Lực đẩy mềm (soft repulsion):
#
#    F_rep = collision_normal_force_max × s(t)² × n̂
#
#    Dùng s² thay vì s cho kích hoạt mềm hơn (gradient nhỏ ở gần d0,
#    tăng mạnh khi tiếp cận d_s).
#
#  Bước 4 — Lực giữ cứng (hard stop, chỉ khi d < d_stop):
#
#    F_hold = collision_k_hold × (d_stop - d) × n̂
#
#    Đây là lò xo tuyến tính chỉ kích hoạt khi robot đã xuyên vào vùng cấm.
#    Ngăn robot tiếp tục xuyên qua vật cản.
#
#  Bước 5 — Cản nhớt pháp tuyến (chỉ khi đang tiếp cận, v_n < 0):
#
#    v_n    = v_feedback · n̂
#    F_damp = collision_normal_damping × |v_n| × n̂    (nếu v_n < 0)
#    F_damp ≤ 0.5 × collision_normal_force_max         (hard cap)
#
#  Bước 6 — Tổng hợp và bão hòa:
#
#    F_normal_raw = (F_rep + F_hold + F_damp) × n̂
#    F_normal     = clamp(|F_normal_raw|, 0, collision_force_max_per_contact) × n̂
#
# ──────────────────────────────────────────────────────────────────────────────
#  2.  THÀNH PHẦN TIẾP TUYẾN  (trượt dọc bề mặt vật cản về phía đích)
# ──────────────────────────────────────────────────────────────────────────────
#
#  Ký hiệu:
#    P  = I - n̂n̂ᵀ            ← projection matrix (mặt phẳng tiếp tuyến)
#    e_τ  = P (p_target - p_ee)         lỗi vị trí trong mặt phẳng tiếp tuyến
#    ė_τ  = P (v_target - v_feedback)   lỗi vận tốc tiếp tuyến
#
#  Lực tiếp tuyến:
#
#    F_tan_raw = K_tau × e_τ  +  D_tau × ė_τ  +  K_escape × blocked × α × u_esc
#
#    Trong đó:
#      K_tau = collision_tangent_gain
#      D_tau = collision_tangent_damping
#      blocked  = max(0, -n̂ · (p_target - p_safe))   (mức độ bị chặn)
#      α = exp(-|e_τ|² / d_s²)                         (giảm dần khi có lỗi lớn)
#      u_esc = hướng thoát tiếp tuyến (theo collision_tangent_escape_axis)
#
#  Giới hạn lực tiếp tuyến:
#
#    tangent_cap = min(collision_tangent_force_max,
#                      collision_tangent_force_ratio × collision_force_max_total)
#
#    F_tangential = smoothSaturate(P × F_tan_raw, w × tangent_cap)
#    w = smoothstep(t)   (giảm về 0 khi xa vật cản)
#
# ──────────────────────────────────────────────────────────────────────────────
#  3.  LỌC VÀ GIỚI HẠN ĐẦU RA
# ──────────────────────────────────────────────────────────────────────────────
#
#  Sau khi tổng hợp:
#    F_total_raw = F_normal + F_tangential
#    F_total_raw = smoothSaturate(F_total_raw, collision_force_max_total)  ← tanh-sat
#
#  Qua bộ lọc thông thấp + slew-rate trước khi publish:
#    • Khi |F| tăng: dùng attack cutoff = collision_force_attack_hz
#    • Khi |F| giảm: dùng release cutoff = collision_force_release_hz
#    • Giới hạn tốc độ thay đổi: collision_force_slew_rate (N/s)
#
# ══════════════════════════════════════════════════════════════════════════════
#  HƯỚNG DẪN TUNING
# ══════════════════════════════════════════════════════════════════════════════
#
#  Bước 1 — Xác định vùng cảm nhận:
#    Đặt collision_influence_distance = khoảng cách bạn muốn robot bắt đầu phản ứng.
#    Đặt collision_safe_distance ≈ 40–60% của influence_distance (vùng lực tăng mạnh).
#    Đặt collision_guard_distance < influence_distance (vùng bộ controller bắt đầu giảm tốc).
#    Đặt collision_task_distance < guard_distance (robot không còn tracking chính xác).
#    Đặt collision_stop_distance nhỏ nhất (dùng cho hard stop lò xo).
#
#  Bước 2 — Điều chỉnh lực đẩy pháp tuyến:
#    • Tăng collision_normal_force_max nếu robot không đủ mạnh để né vật cản.
#    • Giảm nếu robot bị giật/rung sau va chạm.
#    • Tăng collision_normal_damping nếu robot dao động khi áp vào vật cản.
#    • Chú ý: damping_cap = 0.5 × normal_force_max (tự động).
#
#  Bước 3 — Điều chỉnh hard stop:
#    • Tăng collision_k_hold nếu robot vẫn tiếp tục xuyên vào vật cản sau khi
#      đã đến collision_stop_distance.
#    • Tham số này nên là 50–200 (N/m) tùy độ cứng vật cản.
#
#  Bước 4 — Điều chỉnh lực tiếp tuyến:
#    • Đặt collision_tangent_enabled: false để debug thành phần pháp tuyến trước.
#    • Tăng collision_tangent_gain để robot trượt nhanh hơn về phía đích.
#    • Tăng collision_tangent_damping để giảm dao động khi trượt.
#    • Đặt collision_tangent_escape_axis = hướng thoát ưu tiên (x/y/z trong world).
#    • collision_tangent_force_ratio giới hạn tỉ lệ lực tiếp tuyến / tổng.
#
#  Bước 5 — Điều chỉnh bộ lọc:
#    • collision_force_attack_hz: cao = phản ứng nhanh hơn khi chạm vật cản.
#    • collision_force_release_hz: thấp = nhả lực chậm hơn (giảm jitter sau va chạm).
#    • collision_force_slew_rate: giới hạn tốc độ thay đổi lực (N/s). Giảm giá trị
#      này nếu robot bị giật mạnh khi va chạm đột ngột.
#
#  Ghi chú về collision_threshold:
#    Nên đặt >= collision_influence_distance để Tesseract trả về đủ contact pairs.
#    Nếu đặt nhỏ hơn influence_distance, lực có thể không được tính đúng.
#
###############################################################################
online_collision_debugger:
  ros__parameters:

    # ── Contact detection ────────────────────────────────────────────────────
    # collision_threshold: bán kính tìm kiếm va chạm của Tesseract (m).
    # Đặt >= collision_influence_distance để không bỏ sót contact pairs.
    collision_threshold: 0.05
    contact_point_radius: 0.004

    # ── Output channels ──────────────────────────────────────────────────────
    debug_markers_enabled: true
    publish_collision_wrench: true
    publish_contact_debug_text: true

    # ── Frames ───────────────────────────────────────────────────────────────
    marker_frame: world
    wrench_frame: world
    wrench_reference_link: tool0
    collision_command_frame: world

    # ── Zone distances (m) ───────────────────────────────────────────────────
    # Thứ tự bắt buộc: stop < task < guard < safe < influence
    #
    # collision_influence_distance: bắt đầu kích hoạt lực đẩy pháp tuyến
    # collision_safe_distance:      lực đạt ngưỡng tham chiếu (s→1 ở đây)
    # collision_guard_distance:     bộ controller bắt đầu giảm gamma projection
    # collision_task_distance:      dưới đây gamma = 1 (tracking tắt hoàn toàn)
    # collision_stop_distance:      kích hoạt lò xo cứng F_hold
    #
    # Motomini: robot nhỏ, làm việc gần vật cản → vùng ảnh hưởng nhỏ hơn robot thông thường.
    collision_influence_distance: 0.03
    collision_safe_distance:      0.025
    collision_guard_distance:     0.015
    collision_task_distance:      0.005
    collision_stop_distance:      0.001

    # ── Normal repulsion model ────────────────────────────────────────────────
    # collision_k_rep: hệ số đẩy nghịch đảo bình phương
    collision_k_rep: 0.00020982720514447687

    # collision_normal_damping: hệ số cản nhớt theo hướng pháp tuyến (N·s/m)
    #   Motomini làm việc gần vật cản → cần damping cao để tránh bounce.
    collision_normal_damping: 12.0

    # collision_k_hold: hệ số lò xo cứng khi d < collision_stop_distance (N/m)
    #   Tăng nếu robot vẫn xuyên qua vật cản.
    collision_k_hold: 80.0

    # collision_force_max_per_contact: giới hạn lực trên mỗi contact pair (N)
    collision_force_max_per_contact: 8.0

    # collision_force_max_total: giới hạn lực tổng trước khi publish (N)
    #   Dùng bão hòa tanh. Giữ thấp cho Motomini để tránh giật khớp.
    collision_force_max_total: 15.0

    # ── Tangential sliding force ──────────────────────────────────────────────
    # Cho phép robot trượt dọc bề mặt vật cản để tiếp cận đích.
    # !! Đặt false lúc debug pháp tuyến — bật lại sau khi lực pháp tuyến đã đúng hướng.
    collision_tangent_enabled: true

    # collision_tangent_gain: K_tau — kéo robot về lỗi vị trí tiếp tuyến (N/m)
    collision_tangent_gain: 13.55520878452949

    # collision_tangent_damping: D_tau — cản dao động tiếp tuyến (N·s/m)
    collision_tangent_damping: 0.17492671123579662

    # collision_tangent_force_max: giới hạn tuyệt đối lực tiếp tuyến (N)
    #   Giữ nhỏ cho Motomini, tăng dần khi đã ổn định.
    collision_tangent_force_max: 3.0

    # collision_tangent_force_ratio: giới hạn tỉ lệ lực tiếp tuyến / total (0–1)
    collision_tangent_force_ratio: 0.30

    # collision_tangent_escape_axis: trục ưu tiên thoát khi mục tiêu bị chặn
    #   Giá trị hợp lệ: "x", "y", "z"
    collision_tangent_escape_axis: "z"

    # ── Output force filter ───────────────────────────────────────────────────
    # collision_force_attack_hz: tần số cắt low-pass khi lực TĂNG (Hz)
    #   Cao → phản ứng nhanh khi chạm vật cản. Motomini: 15–25 Hz.
    collision_force_attack_hz: 20.0

    # collision_force_release_hz: tần số cắt low-pass khi lực GIẢM (Hz)
    #   Thấp → nhả lực chậm, giảm jitter sau thoát. Motomini: 5–8 Hz.
    collision_force_release_hz: 6.0

    # collision_force_slew_rate: tốc độ thay đổi lực tối đa (N/s)
    #   Motomini nhẹ → giảm slew_rate để tránh giật khớp đột ngột.
    collision_force_slew_rate: 50.0

    # ── RViz visualization (không ảnh hưởng điều khiển) ──────────────────────
    force_arrow_min_length: 0.01
    force_arrow_max_length: 0.20
