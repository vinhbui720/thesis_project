###############################################################################
#  planning_params.yaml
#  Runtime-tunable planning hyperparameters for MotoMini.
#  Edit this file and relaunch — no rebuild needed.
###############################################################################

motomini_planning_node:
  ros__parameters:

    # ===========================================================================
    #  MOTION INSTRUCTION TYPE
    #   "FREESPACE" — robot reaches each Cartesian waypoint via any joint path,
    #                 orientation is NOT constrained → cheaper solve, more rotation.
    #   "LINEAR"    — robot moves in a straight TCP line between waypoints,
    #                 orientation follows the path → more constrained, less rotation.
    # ===========================================================================
    move_instruction_type: "FREESPACE"

    # ===========================================================================
    #  OMPL — runtime enable/disable toggle (overrides launch-time use_ompl flag)
    # ===========================================================================
    use_ompl: false

    # ===========================================================================
    #  OMPL hyperparameters
    # ===========================================================================
    ompl_planning_time: 10.0            # seconds allowed per OMPL planning call
    ompl_max_solutions: 5               # OMPL stops after finding this many solutions
    ompl_simplify: true                 # post-process path to smooth/shorten
    ompl_longest_valid_segment: 0.005   # collision check resolution (meters in joint space)
    ompl_rrt_range_1: 0.05             # RRTConnect tree expansion range — tight
    ompl_rrt_range_2: 0.10             # RRTConnect tree expansion range — loose

    # ===========================================================================
    #  TRAJOPT-IFOPT — Enable / Disable Flags
    #  Toggle each optimizer term on or off independently.
    # ===========================================================================
    ifopt_joint_cost_enable: true          # penalise large joint movements
    ifopt_cart_constraint_enable: true     # enforce Cartesian target (hard constraint)
    ifopt_cart_cost_enable: false          # Cartesian target as soft cost (use constraint OR cost, not both)
    ifopt_coll_constraint_enable: false    # hard collision constraint (very slow, usually keep false)
    ifopt_coll_cost_enable: true           # soft collision avoidance cost
    ifopt_smooth_vel_enable: true          # velocity smoothing term
    ifopt_smooth_acc_enable: true          # acceleration smoothing term
    ifopt_smooth_jerk_enable: true         # jerk smoothing term

    # ===========================================================================
    #  TRAJOPT-IFOPT — Cartesian Constraint Coefficients (per axis)
    #  Each coefficient is the penalty weight for violating that DOF.
    #  Set rotation coefficients to 0.0 to allow free end-effector rotation.
    # ===========================================================================
    ifopt_cart_coeff_x:  100.0   # X translation weight
    ifopt_cart_coeff_y:  100.0   # Y translation weight
    ifopt_cart_coeff_z:  100.0   # Z translation weight
    ifopt_cart_coeff_rx: 10.0   # Roll  weight (0 = free)
    ifopt_cart_coeff_ry: 10.0   # Pitch weight (0 = free)
    ifopt_cart_coeff_rz: 10.0   # Yaw   weight (0 = free)

    # Joint cost (discourages large joint movements; acts like a regularizer)
    ifopt_joint_cost_coeff: 5.0

    # ===========================================================================
    #  TRAJOPT-IFOPT — Collision Avoidance (soft cost, not hard constraint)
    #  collision_cost_margin: minimum clearance (meters) from obstacles
    #  collision_cost_coeff:  penalty for violating the margin (higher = stronger push)
    #  coll_margin_buffer:    extra buffer on top of margin for LVS swept volume check
    # ===========================================================================
    ifopt_coll_cost_margin: 0.0002        # 20 mm minimum clearance
    ifopt_coll_cost_coeff: 50.0        # penalty weight
    ifopt_coll_margin_buffer: 0.2      # swept-volume buffer
    # 0 = DISCRETE, 1 = CONTINUOUS, 2 = LVS_CONTINUOUS
    ifopt_coll_eval_type: 0
    ifopt_coll_lvs_length: 0.005        # longest_valid_segment_length (m)

    # ===========================================================================
    #  TRAJOPT-IFOPT — Trajectory Smoothing
    #  Regularize velocity / acceleration / jerk across waypoints.
    #  Lower values = less smooth but more aggressive optimization.
    # ===========================================================================
    ifopt_smooth_vel_coeff: 0.1     # velocity smoothing weight
    ifopt_smooth_acc_coeff: 1.0     # acceleration smoothing weight
    ifopt_smooth_jerk_coeff: 1.0    # jerk smoothing weight

    # ===========================================================================
    #  TRAJOPT-IFOPT — SQP Solver
    # ===========================================================================
    ifopt_max_iter: 200                    # max SQP iterations
    ifopt_min_approx_improve: 1.0e-3       # stop if cost improvement < this
    ifopt_min_trust_box_size: 1.0e-5       # stop if trust region shrinks below this
    ifopt_initial_trust_box_size: 0.5      # initial SQP step size

    # ===========================================================================
    #  MPC TRACKING PARAMETERS
    # ===========================================================================
    tracking_horizon: 8                   # number of horizon steps; keep >=5 for smooth streaming
    tracking_dt: 0.02                      # MPC time step (seconds)
    tracking_w_cart: 10.0                  # Cartesian tracking weight
    tracking_w_vel: 1.0                    # Velocity smoothing weight
    tracking_w_acc: 0.5                    # Acceleration smoothing weight
    tracking_d_safe: 0.01                  # Collision safety margin (meters)
    tracking_velocity_limit_scale: 0.65    # fraction of URDF joint velocity limits for real robot tracking
    tracking_accel_limit: 8.0              # joint velocity slew limit (rad/s^2)
    tracking_command_lead_limit: 0.12      # max command lead over measured joints (rad)
    tracking_velocity_filter_alpha: 0.55   # higher = more responsive, lower = smoother
    tracking_start_ramp_time: 0.6          # seconds to S-ramp from start scale to full tracking velocity
    tracking_start_velocity_scale: 0.15    # initial fraction during ramp; avoids a hard first tick
    tracking_target_pos_alpha: 0.35        # target pose smoothing; higher tracks target updates faster
    tracking_target_rot_alpha: 0.20        # target orientation smoothing
    tracking_output_dt: 0.004              # dense trajectory resolution sent to /path_command (seconds)
    tracking_use_smooth_output: true       # cubic smooth output instead of coarse MPC knots
    tracking_cart_pos_gain: 1.0            # Cartesian position step gain before speed clamp
    tracking_cart_rot_gain: 0.5            # Cartesian orientation step gain before speed clamp
    tracking_max_cart_speed: 0.25          # max Cartesian correction speed (m/s)
    tracking_max_rot_speed: 1.0            # max orientation correction speed (rad/s)
    tracking_orientation_weight: 0.0       # 0=position-only straight tracking, 1=full orientation tracking
    # 0 = DISCRETE, 1 = CONTINUOUS, 2 = LVS_CONTINUOUS
    tracking_coll_type: 0
    tracking_max_iter: 3                   # Max SQP iterations per tick

motomini_traj_streamer:
  ros__parameters:
    rate_hz: 125.0                         # final /joint_command publish rate
    interpolate_stream_output: true        # Hermite interpolate between cache samples
    min_traj_update_interval_sec: 0.02     # accept new /path_command at most every 20 ms
    splice_w_pos: 1.0                      # cache splice position matching weight
    splice_w_vel: 0.5                      # cache splice velocity matching weight
